# Enforce Terraform formatting before pushes.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: terraform-fmt-check
        name: terraform fmt (check)
        entry: terraform fmt -recursive -check
        language: system
        files: "\\.tf$"
        stages: [pre-push]
