# Traefik Helm values
# The local Helm installer overrides acm_certificate_arn at install time.

deployment:
  replicas: 2

# Expose Traefik via an AWS NLB with TLS termination at the load balancer.
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "${acm_certificate_arn}"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"

ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
    redirectTo:
      port: websecure
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    tls:
      enabled: true

# Enable the Traefik dashboard (restrict access in prod).
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure

# Let Traefik watch all namespaces for Ingress / IngressRoute objects.
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

# cert-manager handles certificate issuance; Traefik just terminates TLS.
# If you want Traefik to also manage certs via ACME, configure certResolvers here.

logs:
  general:
    level: INFO
  access:
    enabled: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"
