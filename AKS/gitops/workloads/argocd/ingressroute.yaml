apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # This route serves both the browser UI and CLI/gRPC-Web traffic.
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.ceedev.co.uk`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-tls
