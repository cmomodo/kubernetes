apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-test
  namespace: argocd
  labels:
    app.kubernetes.io/name: nginx-test
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: gitops
spec:
  project: default
  source:
    repoURL: https://github.com/cmomodo/kubernetes.git
    targetRevision: main
    path: AKS/gitops/workloads/nginx-test
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
