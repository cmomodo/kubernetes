apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: cluster-issuer
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@ceedev.co.uk
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: REPLACE_WITH_ROUTE53_ZONE_ID
            # IRSA is used — no static credentials. The cert-manager
            # ServiceAccount (cert-manager:cert-manager) must be annotated
            # with the cert-manager IRSA role ARN.
