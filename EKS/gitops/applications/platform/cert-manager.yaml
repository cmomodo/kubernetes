apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: 1.15.3
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/EKS/helm-values/cert-manager.yaml
        parameters:
          - name: crds.enabled
            value: "true"
          # IRSA role ARN — set via CI or update in Git after terraform apply.
          # The value must match aws_iam_role.cert_manager.arn.
          - name: serviceAccount.annotations.eks\\.amazonaws\\.com/role-arn
            value: arn:aws:iam::ACCOUNT_ID:role/cert-manager-irsa
        valuesObject: |
          crds:
            enabled: true
    - repoURL: https://github.com/cmomodo/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
