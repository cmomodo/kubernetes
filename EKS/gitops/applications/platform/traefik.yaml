apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 29.0.1
      helm:
        releaseName: traefik
        valueFiles:
          - $values/EKS/helm-values/traefik.yaml
        parameters:
          # ACM wildcard certificate ARN — set via CI or update in Git after terraform apply.
          - name: service.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-ssl-cert
            value: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/REPLACE_ME
          - name: service.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-ssl-ports
            value: "443"
          - name: service.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-backend-protocol
            value: tcp
    - repoURL: https://github.com/cmomodo/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
