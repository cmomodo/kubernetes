provider:
  name: aws

env:
  - name: AWS_REGION
    value: us-east-1

domainFilters:
  - ceedev.co.uk

txtOwnerId: "external-dns"

policy: sync

# serviceAccount IRSA annotation is injected by the Argo CD Application
# (gitops/applications/platform/external-dns.yaml) via helm.parameters.
# For local installs, scripts/install-platform-addons.sh sets it with
# --set-string.
serviceAccount:
  annotations: {}
  # eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/external-dns-irsa"
