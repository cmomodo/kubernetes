ingressShim:
  defaultACMEChallengeType: dns01
  defaultDNS01SolverName: route53

extraArgs:
  - --dns01-recursive-nameservers=8.8.8.8:53,8.8.4.4:53
  - --dns01-recursive-nameservers-only

# Terraform associates this ServiceAccount with its IAM role using EKS Pod
# Identity. No role annotation or static AWS credentials are needed here.
serviceAccount:
  annotations: {}
