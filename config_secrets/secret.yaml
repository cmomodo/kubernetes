# Opaque Secret (base64-encoded values). Create with:
#   kubectl apply -f secret.yaml
# Or from literals:
#   kubectl create secret generic my-secret \
#     --from-literal=username=admin \
#     --from-literal=password='s3cr3t'
apiVersion: v1
kind: Secret
metadata:
  name: my-secret
type: Opaque
stringData:
  username: admin
  password: s3cr3t
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
    - name: demo-container
      image: busybox
      command:
        - /bin/sh
        - -c
        - |
          echo "env USERNAME=$USERNAME"
          echo "secret files:"
          ls -la /etc/secret
          cat /etc/secret/username
          echo

          cat /etc/secret/password
          echo
          sleep 3600
      env:
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: password
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secret
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: my-secret
